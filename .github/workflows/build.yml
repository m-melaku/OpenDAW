name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Cache compiled objects between runs, so JUCE and Tracktion Engine
      # only get rebuilt when they change
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      # Tracktion Engine references JUCE via an SSH URL, so rewrite it to HTTPS
      - name: Fetch submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Ninja
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Cache stats
        if: always()
        run: sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDAW-windows
          path: build-ci/OpenDAW_artefacts/Release/OpenDAW.exe
